<!DOCTYPE html>

<html class="light" lang="pt-BR"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>SmartPDV - Acesso ao Sistema</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&amp;family=Geist+Mono:wght@100..900&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "on-tertiary-fixed-variant": "#2f2ebe",
                    "on-primary-fixed": "#0f0069",
                    "on-error-container": "#93000a",
                    "on-secondary-fixed-variant": "#3f465c",
                    "surface-container-highest": "#d3e4fe",
                    "on-tertiary-fixed": "#07006c",
                    "on-tertiary": "#ffffff",
                    "primary-container": "#4f46e5",
                    "on-secondary": "#ffffff",
                    "primary-fixed": "#e2dfff",
                    "inverse-surface": "#213145",
                    "on-primary-container": "#dad7ff",
                    "on-secondary-container": "#5c647a",
                    "tertiary-container": "#4b4dd8",
                    "surface-container-lowest": "#ffffff",
                    "surface-container-high": "#dce9ff",
                    "on-error": "#ffffff",
                    "outline": "#777587",
                    "on-primary-fixed-variant": "#3323cc",
                    "outline-variant": "#c7c4d8",
                    "background": "#f8f9ff",
                    "on-surface": "#0b1c30",
                    "surface-bright": "#f8f9ff",
                    "surface-dim": "#cbdbf5",
                    "primary-fixed-dim": "#c3c0ff",
                    "tertiary-fixed-dim": "#c0c1ff",
                    "secondary": "#565e74",
                    "secondary-container": "#dae2fd",
                    "error": "#ba1a1a",
                    "inverse-primary": "#c3c0ff",
                    "secondary-fixed": "#dae2fd",
                    "secondary-fixed-dim": "#bec6e0",
                    "tertiary": "#3130c0",
                    "tertiary-fixed": "#e1e0ff",
                    "surface-container": "#e5eeff",
                    "surface": "#f8f9ff",
                    "error-container": "#ffdad6",
                    "surface-tint": "#4d44e3",
                    "on-surface-variant": "#464555",
                    "on-tertiary-container": "#d9d8ff",
                    "primary": "#3525cd",
                    "on-secondary-fixed": "#131b2e",
                    "inverse-on-surface": "#eaf1ff",
                    "on-primary": "#ffffff",
                    "surface-variant": "#d3e4fe",
                    "surface-container-low": "#eff4ff",
                    "on-background": "#0b1c30"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "spacing": {
                    "lg": "24px",
                    "xs": "4px",
                    "base": "4px",
                    "sm": "8px",
                    "2xl": "48px",
                    "margin-mobile": "16px",
                    "md": "16px",
                    "gutter": "20px",
                    "margin-desktop": "32px",
                    "xl": "32px"
            },
            "fontFamily": {
                    "headline-lg": ["Geist"],
                    "headline-lg-mobile": ["Geist"],
                    "headline-xl": ["Geist"],
                    "mono-label": ["Geist Mono"],
                    "body-sm": ["Geist"],
                    "label-md": ["Geist"],
                    "body-lg": ["Geist"],
                    "body-md": ["Geist"],
                    "headline-md": ["Geist"]
            },
            "fontSize": {
                    "headline-lg": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "600"}],
                    "headline-lg-mobile": ["24px", {"lineHeight": "32px", "fontWeight": "600"}],
                    "headline-xl": ["40px", {"lineHeight": "48px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                    "mono-label": ["13px", {"lineHeight": "16px", "fontWeight": "500"}],
                    "body-sm": ["14px", {"lineHeight": "20px", "fontWeight": "400"}],
                    "label-md": ["14px", {"lineHeight": "16px", "letterSpacing": "0.02em", "fontWeight": "600"}],
                    "body-lg": ["18px", {"lineHeight": "28px", "fontWeight": "400"}],
                    "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                    "headline-md": ["24px", {"lineHeight": "32px", "fontWeight": "600"}]
            }
          },
        },
      }
    </script>
<style>
        body {
            font-family: 'Geist', sans-serif;
            transition: background-color 0.3s ease;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .geometric-pattern {
            background-color: transparent;
            background-image: radial-gradient(#4f46e5 0.5px, transparent 0.5px), radial-gradient(#4f46e5 0.5px, #f8f9ff 0.5px);
            background-size: 20px 20px;
            background-position: 0 0,10px 10px;
            opacity: 0.05;
        }
        .dark .geometric-pattern {
            background-image: radial-gradient(#dad7ff 0.5px, transparent 0.5px), radial-gradient(#dad7ff 0.5px, #0b1c30 0.5px);
            opacity: 0.03;
        }
        .glass-card {
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }
        .step-transition {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .input-focus-ring:focus {
            outline: none;
            box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.2);
        }
    </style>
</head>
<body class="bg-background text-on-background min-h-screen flex flex-col overflow-x-hidden">
<!-- Subtle Background Elements -->
<div class="fixed inset-0 pointer-events-none overflow-hidden">
<div class="absolute inset-0 geometric-pattern"></div>
<div class="absolute top-[-10%] left-[-10%] w-[40%] h-[40%] bg-primary-container/10 rounded-full blur-[120px]"></div>
<div class="absolute bottom-[-10%] right-[-10%] w-[40%] h-[40%] bg-tertiary-container/10 rounded-full blur-[120px]"></div>
</div>
<!-- Header / Theme Toggle -->
<header class="relative z-50 flex justify-between items-center p-xl md:px-2xl">
<div class="flex items-center gap-sm">
<span class="text-primary font-headline-md text-headline-md font-black tracking-tight">SmartPDV</span>
</div>
<button class="p-sm rounded-full bg-surface-container hover:bg-surface-container-highest transition-colors flex items-center justify-center text-on-surface-variant hover:text-on-surface" onclick="toggleTheme()" title="Alternar Tema">
<span class="material-symbols-outlined" id="theme-icon">light_mode</span>
</button>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow flex items-center justify-center p-md relative z-10">
<div class="w-full max-w-[480px] bg-surface-container-lowest shadow-xl rounded-xl border border-outline-variant/30 overflow-hidden step-transition" id="auth-card">
<div class="p-lg md:p-xl">
<!-- Welcome Section -->
<div class="mb-xl text-center">
<h1 class="font-headline-lg text-headline-lg text-on-surface mb-xs" id="view-title">Bem-vindo</h1>
<p class="font-body-md text-body-md text-on-surface-variant" id="view-subtitle">Acesse sua conta para gerenciar seu negócio.</p>
</div>
<!-- View Container -->
<div class="space-y-lg" id="view-login">
<form class="space-y-md" onsubmit="return false">
<div class="space-y-xs">
<label class="font-label-md text-label-md text-on-surface-variant ml-xs">Login</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-md text-on-surface-variant text-[20px]">person</span>
<input class="w-full h-12 pl-11 pr-md bg-surface-container-low border border-outline-variant rounded-lg font-body-md text-body-md focus:border-primary input-focus-ring transition-all" placeholder="Seu usuário" type="text"/>
</div>
</div>
<div class="space-y-xs">
<label class="font-label-md text-label-md text-on-surface-variant ml-xs">Senha</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-md text-on-surface-variant text-[20px]">lock</span>
<input class="w-full h-12 pl-11 pr-md bg-surface-container-low border border-outline-variant rounded-lg font-body-md text-body-md focus:border-primary input-focus-ring transition-all" placeholder="••••••••" type="password"/>
</div>
</div>
<div class="flex items-center justify-between pt-xs">
<label class="flex items-center gap-xs cursor-pointer group">
<input class="w-4 h-4 rounded border-outline-variant text-primary focus:ring-primary" type="checkbox"/>
<span class="font-label-md text-label-md text-on-surface-variant group-hover:text-on-surface transition-colors">Lembrar-me</span>
</label>
<a class="font-label-md text-label-md text-primary hover:underline" href="#">Esqueci a senha</a>
</div>
<button class="w-full h-12 bg-primary text-on-primary font-label-md text-label-md rounded-lg shadow-sm hover:opacity-90 active:scale-[0.98] transition-all duration-150">
                            Entrar
                        </button>
</form>
<div class="relative py-sm">
<div class="absolute inset-0 flex items-center"><div class="w-full border-t border-outline-variant"></div></div>
<div class="relative flex justify-center text-label-md"><span class="bg-surface-container-lowest px-md text-on-surface-variant">Novos acessos</span></div>
</div>
<div class="grid grid-cols-2 gap-md">
<button class="w-full py-sm border border-outline-variant hover:bg-surface-container-low rounded-lg font-label-md text-label-md text-on-surface-variant transition-colors" onclick="switchView('store')">
                            Cadastrar Loja
                        </button>
<button class="w-full py-sm border border-outline-variant hover:bg-surface-container-low rounded-lg font-label-md text-label-md text-on-surface-variant transition-colors" onclick="switchView('employee')">
                            Cadastrar Equipe
                        </button>
</div>
</div>
<!-- View Employee Registration -->
<div class="hidden space-y-lg" id="view-employee">
<form class="grid grid-cols-1 md:grid-cols-2 gap-md" onsubmit="return false">
<div class="space-y-xs">
<label class="font-label-md text-label-md text-on-surface-variant ml-xs">Nome Completo</label>
<input class="w-full h-11 px-md bg-surface-container-low border border-outline-variant rounded-lg font-body-md text-body-md focus:border-primary input-focus-ring" type="text"/>
</div>
<div class="space-y-xs">
<label class="font-label-md text-label-md text-on-surface-variant ml-xs">Email</label>
<input class="w-full h-11 px-md bg-surface-container-low border border-outline-variant rounded-lg font-body-md text-body-md focus:border-primary input-focus-ring" type="email"/>
</div>
<div class="space-y-xs">
<label class="font-label-md text-label-md text-on-surface-variant ml-xs">CPF</label>
<input class="w-full h-11 px-md bg-surface-container-low border border-outline-variant rounded-lg font-body-md text-body-md focus:border-primary input-focus-ring" placeholder="000.000.000-00" type="text"/>
</div>
<div class="space-y-xs">
<label class="font-label-md text-label-md text-on-surface-variant ml-xs">Login</label>
<input class="w-full h-11 px-md bg-surface-container-low border border-outline-variant rounded-lg font-body-md text-body-md focus:border-primary input-focus-ring" type="text"/>
</div>
<div class="space-y-xs">
<label class="font-label-md text-label-md text-on-surface-variant ml-xs">Perfil</label>
<select class="w-full h-11 px-md bg-surface-container-low border border-outline-variant rounded-lg font-body-md text-body-md focus:border-primary input-focus-ring appearance-none">
<option>Vendedor</option>
<option>Gerente</option>
<option>Administrador</option>
<option>Estoquista</option>
</select>
</div>
<div class="space-y-xs">
<label class="font-label-md text-label-md text-on-surface-variant ml-xs">ID da Loja</label>
<input class="w-full h-11 px-md bg-surface-container-low border border-outline-variant rounded-lg font-body-md text-body-md focus:border-primary input-focus-ring" placeholder="Ex: STORE-001" type="text"/>
</div>
<div class="space-y-xs">
<label class="font-label-md text-label-md text-on-surface-variant ml-xs">Senha</label>
<input class="w-full h-11 px-md bg-surface-container-low border border-outline-variant rounded-lg font-body-md text-body-md focus:border-primary input-focus-ring" type="password"/>
</div>
<div class="space-y-xs">
<label class="font-label-md text-label-md text-on-surface-variant ml-xs">Confirmar Senha</label>
<input class="w-full h-11 px-md bg-surface-container-low border border-outline-variant rounded-lg font-body-md text-body-md focus:border-primary input-focus-ring" type="password"/>
</div>
<div class="md:col-span-2 pt-md space-y-sm">
<button class="w-full h-12 bg-primary text-on-primary font-label-md text-label-md rounded-lg shadow-sm hover:opacity-90 active:scale-[0.98] transition-all">
                                Cadastrar Funcionário
                            </button>
<button class="w-full py-sm text-center font-label-md text-label-md text-primary hover:bg-primary/5 rounded-lg transition-colors" onclick="switchView('login')">
                                Voltar para o Login
                            </button>
</div>
</form>
</div>
<!-- View Store Registration -->
<div class="hidden space-y-lg" id="view-store">
<form class="space-y-md" onsubmit="return false">
<div class="space-y-xs">
<label class="font-label-md text-label-md text-on-surface-variant ml-xs">Razão Social</label>
<input class="w-full h-11 px-md bg-surface-container-low border border-outline-variant rounded-lg font-body-md text-body-md focus:border-primary input-focus-ring" type="text"/>
</div>
<div class="grid grid-cols-2 gap-md">
<div class="space-y-xs">
<label class="font-label-md text-label-md text-on-surface-variant ml-xs">CNPJ</label>
<input class="w-full h-11 px-md bg-surface-container-low border border-outline-variant rounded-lg font-body-md text-body-md focus:border-primary input-focus-ring" placeholder="00.000.000/0000-00" type="text"/>
</div>
<div class="space-y-xs">
<label class="font-label-md text-label-md text-on-surface-variant ml-xs">Inscrição Estadual (IE)</label>
<input class="w-full h-11 px-md bg-surface-container-low border border-outline-variant rounded-lg font-body-md text-body-md focus:border-primary input-focus-ring" type="text"/>
</div>
</div>
<div class="space-y-xs">
<label class="font-label-md text-label-md text-on-surface-variant ml-xs">Endereço Completo</label>
<textarea class="w-full p-md bg-surface-container-low border border-outline-variant rounded-lg font-body-md text-body-md focus:border-primary input-focus-ring resize-none" placeholder="Rua, Número, Bairro, Cidade - UF" rows="3"></textarea>
</div>
<div class="pt-md space-y-sm">
<button class="w-full h-12 bg-primary text-on-primary font-label-md text-label-md rounded-lg shadow-sm hover:opacity-90 active:scale-[0.98] transition-all">
                                Registrar Minha Loja
                            </button>
<button class="w-full py-sm text-center font-label-md text-label-md text-primary hover:bg-primary/5 rounded-lg transition-colors" onclick="switchView('login')">
                                Voltar para o Login
                            </button>
</div>
</form>
</div>
</div>
<!-- Card Footer -->
<div class="px-xl py-md bg-surface-container-low flex justify-center items-center">
<p class="font-body-sm text-body-sm text-on-surface-variant">© 2024 SmartPDV. Tecnologia para crescer.</p>
</div>
</div>
</main>
<!-- Global Footer -->
<footer class="relative z-10 w-full py-lg px-xl flex flex-col md:flex-row justify-between items-center gap-md">
<div class="flex items-center gap-md">
<a class="font-label-md text-label-md text-on-surface-variant hover:text-primary transition-colors" href="#">Suporte</a>
<span class="w-1 h-1 bg-outline-variant rounded-full hidden md:block"></span>
<a class="font-label-md text-label-md text-on-surface-variant hover:text-primary transition-colors" href="#">Documentação</a>
</div>
<p class="font-label-md text-label-md text-on-surface-variant opacity-70">v1.2.4 Production</p>
</footer>
<script>
        function toggleTheme() {
            const html = document.documentElement;
            const icon = document.getElementById('theme-icon');
            if (html.classList.contains('dark')) {
                html.classList.remove('dark');
                icon.textContent = 'light_mode';
            } else {
                html.classList.add('dark');
                icon.textContent = 'dark_mode';
            }
        }

        const views = {
            login: {
                el: document.getElementById('view-login'),
                title: 'Bem-vindo',
                subtitle: 'Acesse sua conta para gerenciar seu negócio.',
                maxWidth: '480px'
            },
            employee: {
                el: document.getElementById('view-employee'),
                title: 'Novo Funcionário',
                subtitle: 'Preencha os dados técnicos para o novo acesso.',
                maxWidth: '640px'
            },
            store: {
                el: document.getElementById('view-store'),
                title: 'Configurar Loja',
                subtitle: 'Registre os dados fiscais da sua empresa.',
                maxWidth: '520px'
            }
        };

        function switchView(viewName) {
            const card = document.getElementById('auth-card');
            const titleEl = document.getElementById('view-title');
            const subtitleEl = document.getElementById('view-subtitle');

            // Fade out
            card.style.opacity = '0';
            card.style.transform = 'translateY(10px)';

            setTimeout(() => {
                // Hide all
                Object.keys(views).forEach(v => views[v].el.classList.add('hidden'));
                
                // Show selected
                const target = views[viewName];
                target.el.classList.remove('hidden');
                titleEl.textContent = target.title;
                subtitleEl.textContent = target.subtitle;
                card.style.maxWidth = target.maxWidth;

                // Fade in
                card.style.opacity = '1';
                card.style.transform = 'translateY(0)';
            }, 300);
        }
    </script>
</body></html>
