# ===============================
# DATASOURCE - MySQL
# ===============================
spring.datasource.url=jdbc:mysql://localhost:3306/smartpdv?useSSL=false&serverTimezone=America/Sao_Paulo&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# JPA / HIBERNATE
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Evita erro comum de LOB no Oracle (comentado - nao necessario no MySQL)
#spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# ===============================
# PERFORMANCE (opcional, mas bom)
# ===============================
spring.jpa.open-in-view=false
